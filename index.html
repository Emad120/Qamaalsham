<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قمر الشام - ديوان الحكم</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Tahoma, Arial, sans-serif;
        }
        body {
            background-color: #0d1117;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        /* الهيدر العلوي */
        .header {
            background-color: #161b22;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #30363d;
        }
        .header-title {
            color: #f0883e;
            font-size: 16px;
            font-weight: bold;
        }
        /* منطقة الشات والرسائل */
        .chat-container {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            background-color: #21262d;
            padding: 10px 14px;
            border-radius: 8px;
            max-width: 85%;
            word-break: normal;
            overflow-wrap: break-word;
            line-height: 1.6;
            font-size: 14px;
        }
        .message .username {
            color: #58a6ff;
            font-weight: bold;
            margin-bottom: 4px;
            display: block;
        }
        /* تنسيق الصور والإيموجيات داخل الشات */
        .message img, .emoji-box img {
            width: 32px;
            height: 32px;
            object-fit: contain;
            vertical-align: middle;
            margin: 2px;
        }
        /* شريط الإيموجيات والسفلية */
        .emoji-bar {
            display: flex;
            gap: 8px;
            padding: 8px 15px;
            background-color: #161b22;
            overflow-x: auto;
            border-top: 1px solid #30363d;
        }
        .emoji-bar img {
            width: 30px;
            height: 30px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .emoji-bar img:hover {
            transform: scale(1.2);
        }
        /* صندوق الإرسال */
        .footer-input {
            display: flex;
            padding: 10px 15px;
            background-color: #161b22;
            gap: 10px;
            align-items: center;
        }
        .footer-input input {
            flex: 1;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 20px;
            padding: 10px 15px;
            color: #fff;
            outline: none;
            font-size: 14px;
        }
        .footer-input button {
            background-color: #d1862d;
            border: none;
            border-radius: 20px;
            color: #fff;
            padding: 8px 18px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-title">👑 قمر الشام - ديوان الحكم</div>
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="message">
            <span class="username">بوت قمر الشام 🤖</span>
            مرحباً بك يا ملك عماد تحت ياسمين قمر الشام ✨
        </div>
        <div class="message">
            <span class="username">عماد</span>
            أهلاً بالجميع، الروم العام جاهز والميكات شغالة! <img src="10s.gif" alt="emoji"> <img src="11.gif" alt="emoji"> <img src="20.gif" alt="emoji">
        </div>
    </div>

    <div class="emoji-bar">
        <img src="10s.gif" alt="emoji">
        <img src="11.gif" alt="emoji">
        <img src="20.gif" alt="emoji">
        <img src="3962.gif" alt="emoji">
        <img src="5.gif" alt="emoji">
        <img src="a21.gif" alt="emoji">
        <img src="a22.gif" alt="emoji">
        <img src="a25.gif" alt="emoji">
        <img src="a26.gif" alt="emoji">
        <img src="a27.gif" alt="emoji">
        <img src="a28.gif" alt="emoji">
    </div>

    <div class="footer-input">
        <input type="text" id="messageInput" placeholder="اكتب رسالتك...">
        <button onclick="sendMessage()">إرسال</button>
    </div>

    <script>
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const container = document.getElementById('chatContainer');
            if(input.value.trim() !== "") {
                const div = document.createElement('div');
                div.className = 'message';
                div.innerHTML = `<span class="username">عماد</span> ${input.value}`;
                container.appendChild(div);
                input.value = "";
                container.scrollTop = container.scrollHeight;
            }
        }
    </script>
</body>
</html>
