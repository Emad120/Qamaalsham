<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شات قمر الشام - نسخة أساسية</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: #120c1f; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: #1f2937; padding: 10px; text-align: center; border-bottom: 2px solid #d97706; display: flex; justify-content: space-between; align-items: center; }
        #roomTitle { color: #d97706; font-weight: bold; }
        #memoryBtn { background: #374151; color: #fff; border: 1px solid #d97706; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 0.8rem; }
        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { background: rgba(255,255,255,0.08); padding: 10px; border-radius: 8px; word-break: break-word; }
        .bot { background: rgba(217,119,6,0.2); border-right: 3px solid #d97706; }
        .user { background: rgba(255,255,255,0.05); }
        .input-bar { display: flex; gap: 8px; padding: 10px; background: #1f2937; border-top: 2px solid #d97706; }
        #messageInput { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #d97706; background: #111827; color: #fff; outline: none; }
        button { padding: 10px 18px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        #sendBtn { background: linear-gradient(135deg, #d97706, #b45309); color: #fff; }
        #roomToggle { background: #374151; color: #fff; }
        .info { text-align: center; color: #9ca3af; font-size: 0.8rem; }

        /* نافذة الذاكرة */
        .memory-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 100; justify-content: center; align-items: center; padding: 20px; }
        .memory-overlay.show { display: flex; }
        .memory-box { background: #1f2937; border: 2px solid #d97706; border-radius: 12px; padding: 15px; width: 100%; max-width: 350px; max-height: 70vh; display: flex; flex-direction: column; }
        .memory-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .memory-header h3 { color: #d97706; font-size: 1rem; }
        #closeMemoryBtn { background: rgba(255,255,255,0.1); border: none; color: #fff; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; }
        #memoryList { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
        .memory-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.05); padding: 8px; border-radius: 6px; font-size: 0.8rem; }
        .memory-item span { flex: 1; word-break: break-word; }
        .delete-btn { background: #ef4444; color: #fff; border: none; border-radius: 4px; padding: 3px 8px; cursor: pointer; font-size: 0.7rem; }
    </style>
</head>
<body>
    <header>
        <h3>شات قمر الشام</h3>
        <div id="roomTitle">الروم العام</div>
        <button id="memoryBtn" onclick="showMemory()">🧠 ذاكرة البوت</button>
    </header>

    <div id="messages"></div>

    <div class="input-bar">
        <button id="roomToggle" onclick="toggleRoom()">تبديل الروم</button>
        <input type="text" id="messageInput" placeholder="اكتب رسالتك..." onkeypress="if(event.key==='Enter') sendMessage()" />
        <button id="sendBtn" onclick="sendMessage()">إرسال</button>
    </div>

    <div class="info">🤖 في الخاص: بوت تعلم: السؤال = الجواب | في العام: بوت + الكلمة المتعلمة</div>

    <!-- نافذة ذاكرة البوت -->
    <div class="memory-overlay" id="memoryOverlay" onclick="closeMemory()">
        <div class="memory-box" onclick="event.stopPropagation()">
            <div class="memory-header">
                <h3>🧠 ردود البوت المحفوظة</h3>
                <button id="closeMemoryBtn" onclick="closeMemory()">✕</button>
            </div>
            <div id="memoryList"></div>
        </div>
    </div>

    <script>
        let currentRoom = 'عام';
        let botMemory = JSON.parse(localStorage.getItem('bot_memory')) || {
            "شلونك": "تمام 🌙",
            "ارقص": "💃"
        };

        function addMessage(text, isBot = false) {
            const messages = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = 'msg ' + (isBot ? 'bot' : 'user');
            div.textContent = text;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }

        function findAnswer(msg) {
            const lower = msg.toLowerCase().trim();
            for (let key in botMemory) {
                if (lower.includes(key.toLowerCase())) {
                    return botMemory[key];
                }
            }
            if (currentRoom === 'خاص') {
                return "ما تعلمت هذا بعد! علمني:\nبوت تعلم: السؤال = الجواب";
            }
            return null;
        }

        function learnBot(message) {
            let clean = message.replace(/بوت تعلم|البوت تعلم|بووت تعلم|البووت تعلم/gi, '').trim();
            clean = clean.replace(/^[:,\s]+/, '');
            const parts = clean.split('=');
            if (parts.length === 2) {
                const q = parts[0].trim();
                const a = parts[1].trim();
                if (q && a) {
                    botMemory[q] = a;
                    localStorage.setItem('bot_memory', JSON.stringify(botMemory));
                    addMessage('🤖 تم الحفظ! "' + q + '" = "' + a + '"', true);
                } else {
                    addMessage('❌ صيغة خاطئة. مثال: بوت تعلم: شلونك = تمام', true);
                }
            } else {
                addMessage('❌ صيغة خاطئة. مثال: بوت تعلم: شلونك = تمام', true);
            }
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const msg = input.value.trim();
            if (!msg) return;

            addMessage('👤 ' + msg);

            if (currentRoom === 'خاص' && (msg.includes('بوت تعلم') || msg.includes('البوت تعلم'))) {
                learnBot(msg);
            } else if (msg.includes('بوت') || msg.includes('بووت') || msg.includes('البوت') || msg.includes('البووت')) {
                const reply = findAnswer(msg);
                if (reply) {
                    setTimeout(() => addMessage('🤖 ' + reply, true), 500);
                }
            }

            input.value = '';
        }

        function toggleRoom() {
            currentRoom = (currentRoom === 'عام') ? 'خاص' : 'عام';
            document.getElementById('roomTitle').textContent = 'الروم ' + currentRoom;
            document.getElementById('messages').innerHTML = '';
            if (currentRoom === 'خاص') {
                addMessage('🔒 الروم الخاص للتدريب مع البوت\nمثال: بوت تعلم: شلونك = تمام', true);
            } else {
                addMessage('📌 الروم العام\nالبوت يرد فقط على الكلمات المتعلمة', true);
            }
        }

        // ============ ذاكرة البوت ============
        function showMemory() {
            const overlay = document.getElementById('memoryOverlay');
            const list = document.getElementById('memoryList');
            list.innerHTML = '';
            for (let key in botMemory) {
                const item = document.createElement('div');
                item.className = 'memory-item';
                item.innerHTML = `
                    <span>${key} = ${botMemory[key]}</span>
                    <button class="delete-btn" onclick="deleteMemoryItem('${key}')">حذف</button>
                `;
                list.appendChild(item);
            }
            overlay.classList.add('show');
        }

        function closeMemory() {
            document.getElementById('memoryOverlay').classList.remove('show');
        }

        function deleteMemoryItem(key) {
            delete botMemory[key];
            localStorage.setItem('bot_memory', JSON.stringify(botMemory));
            // تحديث القائمة فوراً
            showMemory();
            addMessage('🗑️ تم حذف: "' + key + '" من ذاكرة البوت', true);
        }

        // رسالة ترحيب
        addMessage('أهلاً بك في شات قمر الشام ✨', true);
    </script>
</body>
</html>
