<!-- نافذة البروفايل المنبثقة -->
<div class="modal-overlay" id="profileOverlay" onclick="closeProfile()">
    <div class="profile-box" onclick="event.stopPropagation()">
        
        <!-- خلفية البروفايل -->
        <div class="profile-cover" id="profileCover">
            <div class="profile-cover-overlay"></div>
            <button class="profile-close-btn" onclick="closeProfile()">✕</button>
            <div class="profile-avatar">
                <img src="https://i.pravatar.cc/150?img=11" alt="avatar" id="profileAvatar">
            </div>
            <div class="profile-name">عماد ♠</div>
            <div class="profile-rank">الملك 👑</div>
        </div>

        <!-- قسم تغيير الخلفية -->
        <div class="profile-section">
            <div class="section-title">🎨 تغيير الخلفية</div>
            
            <div class="bg-options">
                <div class="bg-option active" onclick="setDefaultBg()">⭐ الافتراضية</div>
                <div class="bg-option" onclick="chooseBgImage()">🖼️ صورة من الجهاز</div>
            </div>
            
            <div class="bg-color-row">
                <div class="bg-color" style="background:linear-gradient(135deg,#1f2937,#111827)" onclick="setBgGradient(this)"></div>
                <div class="bg-color" style="background:linear-gradient(135deg,#312e81,#111827)" onclick="setBgGradient(this)"></div>
                <div class="bg-color" style="background:linear-gradient(135deg,#831843,#111827)" onclick="setBgGradient(this)"></div>
                <div class="bg-color" style="background:linear-gradient(135deg,#064e3b,#111827)" onclick="setBgGradient(this)"></div>
                <div class="bg-color" style="background:linear-gradient(135deg,#7c2d12,#111827)" onclick="setBgGradient(this)"></div>
            </div>
            
            <input type="file" id="bgImageInput" accept="image/*" style="display:none" onchange="applyBgImage(event)">
        </div>

    </div>
</div>

<style>
    .modal-overlay {
        display:none;
        position:fixed;
        inset:0;
        background:rgba(0,0,0,0.75);
        z-index:1000;
        justify-content:center;
        align-items:center;
        padding:15px;
    }
    .modal-overlay.show { display:flex; }

    .profile-box {
        width:100%;
        max-width:380px;
        max-height:85vh;
        background:#111827;
        border-radius:16px;
        overflow-y:auto;
        overflow-x:hidden;
        border:2px solid #d97706;
        box-shadow:0 10px 30px rgba(0,0,0,0.5);
    }

    .profile-cover {
        position:relative;
        height:180px;
        background:linear-gradient(135deg, #1f2937, #111827);
        border-bottom:2px solid #d97706;
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:flex-end;
        padding-bottom:12px;
        transition:background 0.3s;
    }

    .profile-cover-overlay {
        position:absolute;
        inset:0;
        background:rgba(0,0,0,0.35);
    }

    .profile-close-btn {
        position:absolute;
        top:10px;
        left:10px;
        background:rgba(0,0,0,0.5);
        border:none;
        color:#fff;
        width:30px;
        height:30px;
        border-radius:50%;
        cursor:pointer;
        z-index:2;
    }

    .profile-avatar {
        width:75px;
        height:75px;
        border-radius:50%;
        border:3px solid #d97706;
        overflow:hidden;
        margin-bottom:5px;
        z-index:1;
        background:#fff;
    }

    .profile-avatar img {
        width:100%;
        height:100%;
        object-fit:cover;
    }

    .profile-name {
        font-weight:bold;
        font-size:1.1rem;
        color:#fff;
        z-index:1;
    }

    .profile-rank {
        font-size:0.75rem;
        color:#fde047;
        z-index:1;
    }

    .profile-section {
        padding:15px;
    }

    .section-title {
        color:#d97706;
        font-weight:bold;
        font-size:0.9rem;
        margin-bottom:10px;
    }

    .bg-options {
        display:flex;
        flex-wrap:wrap;
        gap:8px;
        margin-bottom:12px;
    }

    .bg-option {
        background:rgba(255,255,255,0.08);
        border:1px solid rgba(255,255,255,0.2);
        color:#e5e7eb;
        padding:8px 12px;
        border-radius:6px;
        cursor:pointer;
        font-size:0.8rem;
    }

    .bg-option.active {
        background:#d97706;
        color:#000;
        font-weight:bold;
    }

    .bg-color-row {
        display:flex;
        gap:8px;
        flex-wrap:wrap;
    }

    .bg-color {
        width:40px;
        height:40px;
        border-radius:8px;
        cursor:pointer;
        border:2px solid transparent;
    }

    .bg-color:hover {
        border-color:#fff;
    }
</style>

<script>
    // إظهار البروفايل
    function openProfile() {
        document.getElementById('profileOverlay').classList.add('show');
    }

    // إغلاق البروفايل
    function closeProfile() {
        document.getElementById('profileOverlay').classList.remove('show');
    }

    // الرجوع للخلفية الافتراضية
    function setDefaultBg() {
        const cover = document.getElementById('profileCover');
        cover.style.background = 'linear-gradient(135deg, #1f2937, #111827)';
        cover.style.backgroundImage = 'linear-gradient(135deg, #1f2937, #111827)';
        markActiveBg(null);
    }

    // فتح نافذة اختيار صورة من الجهاز
    function chooseBgImage() {
        document.getElementById('bgImageInput').click();
    }

    // تطبيق الصورة المختارة
    function applyBgImage(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            const cover = document.getElementById('profileCover');
            cover.style.background = `url('${e.target.result}') center/cover`;
            cover.style.backgroundImage = `url('${e.target.result}')`;
            markActiveBg(null);
        };
        reader.readAsDataURL(file);
    }

    // تطبيق تدرج لوني
    function setBgGradient(el) {
        const cover = document.getElementById('profileCover');
        cover.style.background = getComputedStyle(el).background;
        cover.style.backgroundImage = getComputedStyle(el).backgroundImage;
        markActiveBg(el);
    }

    // تحديد العنصر النشط
    function markActiveBg(el) {
        document.querySelectorAll('.bg-color').forEach(c => c.classList.remove('active'));
        if (el) el.classList.add('active');
        document.querySelectorAll('.bg-option').forEach(o => o.classList.remove('active'));
        if (!el) document.querySelector('.bg-option:first-child').classList.add('active');
    }

    // للاختبار السريع: افتح البروفايل عند النقر على أي زر
    document.addEventListener('DOMContentLoaded', () => {
        // يمكنك استدعاء openProfile() من أي مكان في تطبيقك
        console.log('البروفايل جاهز');
    });
</script>
